[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kcd2-inventory-preset-merger"
version = "0.1.0"
description = "Scanner and analyzer for Kingdom Come: Deliverance II InventoryPreset mod patches."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
